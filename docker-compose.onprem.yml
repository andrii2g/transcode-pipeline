services:
  api:
    build:
      context: .
      dockerfile: src/Demo.UploadApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MediaPipeline__UploadProvider: LocalHttp
      MediaPipeline__TranscodeProvider: FFmpeg
      LocalStorage__PublicBaseUrl: http://localhost:8080
      LocalStorage__TemporaryUploadDirectory: /data/media/temp/uploads
      LocalStorage__SourceDirectory: /data/media/source
      LocalStorage__TemporaryOutputDirectory: /data/media/temp/transcodes
      LocalStorage__OutputDirectory: /data/media/output
      WorkflowStore__ConnectionString: Data Source=/data/db/workflows.db
      Ffmpeg__FfmpegPath: /usr/bin/ffmpeg
      Ffmpeg__FfprobePath: /usr/bin/ffprobe
    volumes:
      - media-data:/data/media
      - workflow-data:/data/db
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  media-data:
  workflow-data:
